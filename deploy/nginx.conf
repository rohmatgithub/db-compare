server {
    listen 80;
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The API marks the session cookie Secure when this is https.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Compare runs stream progress as Server-Sent Events for as long as
        # they run; buffering would delay events and short timeouts would cut
        # the stream. Excel exports can also take a while.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
